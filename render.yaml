services:
  # ----------------------------------------------------------------------------
  # 1. NestJS API Gateway
  # ----------------------------------------------------------------------------
  - type: web
    name: jansetu-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: jansetu-ai-service
          property: host

  # ----------------------------------------------------------------------------
  # 2. FastAPI AI Microservice (Gemini 2.0 & Sarvam AI)
  # ----------------------------------------------------------------------------
  - type: web
    name: jansetu-ai-service
    env: python
    plan: free
    rootDir: backend/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: SARVAM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # ----------------------------------------------------------------------------
  # 3. React + Vite Frontend (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: jansetu-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jansetu-backend
          property: host
      - key: VITE_AI_SERVICE_URL
        fromService:
          type: web
          name: jansetu-ai-service
          property: host
